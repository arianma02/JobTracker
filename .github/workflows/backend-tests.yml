name: Backend tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      JOBTRACK_DATABASE_URL: postgresql://jobtrack_test:local_test_only@127.0.0.1:55433/jobtrack_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobtrack_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: jobtrack_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U jobtrack_test -d jobtrack_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest tests -q
